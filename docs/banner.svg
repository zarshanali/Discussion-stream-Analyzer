<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Discussion Stream Analyzer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.5" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tl"><rect x="80" y="262" width="1120" height="26" rx="13"/></clipPath>
  </defs>
  <rect width="1280" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="28" fill="url(#glow)"/>

  <!-- microphone icon -->
  <g transform="translate(80 58)" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="22" y="0" width="26" height="52" rx="13" fill="#ffffff" fill-opacity="0.18"/>
    <path d="M8 38 C8 62 62 62 62 38"/>
    <path d="M35 60 V78"/>
    <path d="M20 80 H50"/>
  </g>

  <text x="180" y="96" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1">Discussion Stream Analyzer</text>
  <text x="182" y="142" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#e0e7ff">Topics, a timeline and a summary for every transcript, up to 30 at once</text>

  <!-- feature chips -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff">
    <rect x="182" y="170" width="170" height="38" rx="19" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="267" y="195" text-anchor="middle">Topic timeline</text>
    <rect x="366" y="170" width="236" height="38" rx="19" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="484" y="195" text-anchor="middle">Key topics overview</text>
    <rect x="616" y="170" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="691" y="195" text-anchor="middle">Safety scan</text>
    <rect x="780" y="170" width="178" height="38" rx="19" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="869" y="195" text-anchor="middle">Live progress</text>
  </g>

  <!-- topic timeline motif -->
  <text x="80" y="250" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#c7d2fe">TOPIC TIMELINE</text>
  <g clip-path="url(#tl)">
    <rect x="80" y="262" width="1120" height="26" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="80"  y="262" width="210" height="26" fill="#a5b4fc"/>
    <rect x="290" y="262" width="140" height="26" fill="#fda4af"/>
    <rect x="430" y="262" width="250" height="26" fill="#6ee7b7"/>
    <rect x="680" y="262" width="120" height="26" fill="#fcd34d"/>
    <rect x="800" y="262" width="230" height="26" fill="#c4b5fd"/>
    <rect x="1030" y="262" width="170" height="26" fill="#67e8f9"/>
  </g>
  <g stroke="#312e81" stroke-opacity="0.35" stroke-width="2">
    <line x1="290" y1="262" x2="290" y2="288"/><line x1="430" y1="262" x2="430" y2="288"/>
    <line x1="680" y1="262" x2="680" y2="288"/><line x1="800" y1="262" x2="800" y2="288"/>
    <line x1="1030" y1="262" x2="1030" y2="288"/>
  </g>
</svg>
